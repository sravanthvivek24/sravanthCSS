<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #one {
            border: 2px solid #0A2947;
            width: 300px;
            height: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            background-color: #F3E4C9;
        }

        #two {
            border: 2px solid #0A2947;
            width: 200px;
            height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            background-color: #D3D4C0;
        }

        p {
            border: 2px solid #0A2947;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            text-align: center;
            margin: 10px;
            paadding: 10px;
            background-color: #8B5E3C;
        }

        div {
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            border: 2px solid #0A2947;
            width: 120px;
            height: 120px;

        }
    </style>
</head>

<body>
    <div id="one">
        <div id="two">
            <div>
                <p>
                    Flex
                </p>
            </div>
        </div>
    </div>
</body>

</html>
