<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        nav{
            background-color: aqua;
            border: 2px solid black;
            display: flex;
            width: fit-content;
            flex-direction: column;
            height: 150px;
            justify-content: space-around;

        }
        a{
            text-decoration: none;

        }
        a:hover{
            color: red;
            background-color: white;
            border: 2px solid black;
        }
        @media (min-width:700px){
            nav{
                flex-direction: row;
                justify-content: space-around;
                width: 100%;
                height: auto;
            }
        }
    </style>
</head>

<body>
    <nav>
        <a href="">Home</a><a href="">About</a><a href="">Contact</a><a href="">Feedback</a>
    </nav>
</body>

</html>
