<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .cont {
            border: 2px solid red;
            height: 1000px;
            width: 1000px;
            display: grid;
            /* grid-template-columns:  repeat(4, 1fr); */
            grid-template-rows: repeat(4, 1fr);
            grid-template-columns: 200px 300px auto;
            gap: 10px;


        }

        .box {
            border: 1px solid black;
            background-color: yellow;
            

        }
        .box1{
            background-color: blue;
            /* grid-column-start: 1;
            grid-column-end: 3; */
            grid-row-start: 1;
            grid-row-end: 3;
        }
        .box4{
            background-color: green;
                grid-column-start: 4;
                grid-column-end: 5;
            grid-row-start: 1;
            grid-row-end: 3;
        }
       
    </style>
</head>

<body>
    <div class="cont">
        <div class="box box1"> hero 1</div>
        <div class="box"> hero 2</div>
        <div class="box"> hero 3</div>
        <div class="box box4"> hero 4</div>
        <div class="box"> hero 5</div>
        <div class="box"> hero 6</div>
        <div class="box"> hero 7</div>
        <div class="box box8"> hero 8</div>

    </div>
</body>

</html>
