<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0px;
            box-sizing: border-box;
            border-radius: 20px ;
        }
        .main-cont{
            border:0px solid black;
            display: grid;
            gap: 10px;
            width: 1000px;
            height: 500px;
            grid-template-columns:repeat(5,1fr);
            grid-template-rows: repeat(4,1fr) ;
            text-align: center;
        }
        .box1{
            background-color: #458393;
            color: white;
            grid-column: 1/6;
            padding-top: 30px;
            font-size: 40px;
        }
        .box2{
            background-color:deepskyblue ;
            color: white;
            grid-column: 1/3;
            padding-top: 35px;
            font-size: 30px;

        }
        .box3{  
            background-color: lightgreen;
            color: white;
            grid-column: 3/4;
            padding-top: 35px;
            font-size: 30px;
        }
        .box4{
            background-color: red ;
            color: white;
            grid-column: 4/6;
            grid-row: 2/4;
            padding-top:100px;
            font-size: 30px;
        }
        .box5{
            background-color: violet;
            color: white;
            grid-column: 1/2;
             padding-top: 35px;
            font-size: 30px;
        }
        .box6{
            background-color: orange;
            color: white;
            grid-column: 2/3;
             padding-top: 35px;
            font-size: 30px;
        }
        .box7{
            background-color: green;
            color: white;
            grid-column: 3/4;
             padding-top: 35px;
            font-size: 30px;
        }
        .box8{
            background-color: #458393;
            color: white;
            grid-column: 1/6;
            padding-top: 30px;
            font-size: 40px;
        }


        

    </style>
</head>
<body>
    <div class="main-cont">
        <div class="box box1">Headline</div>
        <div class="box box2">New 1</div>
        <div class="box box3"> New 2</div>
        <div class="box box4">Advertisement</div>
        <div class="box box5">New 3</div>
        <div class="box box6">New 4</div>
        <div class="box box7">New 5</div>
        <div class="box box8">Footer</div>
    </div>
</body>

</html>
