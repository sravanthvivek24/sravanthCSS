<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .cont{
            display: grid;
            grid-template-columns: repeat(5,200px);
            grid-template-rows:80px 300px 80px;
        }
        .box{
            border: 2px solid black;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 20px;
        }
        .head{
            grid-area: 1/1/2/6;
            background-color: red;
            
        }
        .side{
            grid-area: 2/1/3/2;
            background-color: green;
        }
        .main{
            grid-area: 2/2/3/5;
            background-color: yellow;
        }
        .right{
            grid-area: 2/5/3/6;
            background-color: green;
        }
        .foot{
            grid-area: 3/1/4/6;
            background-color:red     ;
        }

    </style>
</head>
<body>
   <div class="cont">
    <div class="box head">Header</div>
    <div class="box side">sidebar</div>
    <div class="box main">main</div>
    <div class="box right">Rightbar</div>
    <div class="box foot">Footer</div>
   </div> 
</body>
</html>

<!DOCTYPE html>
