<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            border: 2px solid black;
            height: 100px;
            width: 100px;
            background-color: brown;
            color: cornsilk;
        }
        div:hover{
            border-radius: 50%;
            background-color: aquamarine;
            color: darkred;
            box-shadow: 20px 20px 10px 5px bisque ; 
            text-align: center;
            line-height: 100px;
        }
        nav{
           
           padding: 10px;
            color:white ;
            background-color: lightslategrey;
            text-align: center;
            border:2px solid black;

        }
        a{
            text-decoration: none;
            margin: 10px;
            background-color: lightsteelblue;
            color: whitesmoke;
        }
        a:hover{
            border:2px solid white;
            font-size: 20px;
            color: red;
            
            font-family: cursive;
        }
        button{
            background-color: red;
        }
        button:active{
            background-color: greenyellow;
            font-size: 20px;
            font-family: fantasy;
        }
        input:focus{
            background-color: lightgrey;
        }
        p::after{
            content:"🙏";
        }
        p::before{
            content: "🙏";
        }
        b::first-letter{
            font-family: algerian;
            columns: blue;
        }
        div::first-letter{
            font-family:lucida
            color: blue;
        }
    </style>
</head>
<body>
    <div>
        Zero
    </div>
    <nav>
        <a href=""> Home</a> <a href=""> About</a><a href="">Contact</a>
    </nav>
    <br>
    <button>Click me</button><br>
    <label for="unme">User name</label>
    <input type="text" name="" id="unme"><br>
    <label for="pws">password</label>
    <input type="text" name="" id="pws">
    <p>
        Namaste
    </p>
   <div>
    Lorem ipsum dolor 
   </div>
   
</body>
</html>
